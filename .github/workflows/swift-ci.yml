name: Swift CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the toolchain line to match the release build (Xcode 26.x / Swift 6.2).
  # The runner carries several Xcode 26 point releases; prefer this exact one
  # and fall back to the newest 26.x present so a patch bump on the image does
  # not break CI, while anything older than 26 fails loudly.
  XCODE_PREFERRED: "26.2"

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Ad hoc signing with hardened runtime off for the CI test build only:
      # library validation would refuse to load an ad-hoc-signed test bundle
      # into an ad-hoc-signed hardened host (design 4.2). Release builds keep
      # Developer ID signing and the hardened runtime.
      XCODEBUILD_FLAGS: >-
        -project Prompter/Prompter.xcodeproj
        -scheme Prompter
        -destination platform=macOS,arch=arm64
        -derivedDataPath .dd
        -clonedSourcePackagesDirPath .spm
        CODE_SIGN_IDENTITY=-
        CODE_SIGN_STYLE=Manual
        DEVELOPMENT_TEAM=
        ENABLE_HARDENED_RUNTIME=NO
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d "/Applications/Xcode_${XCODE_PREFERRED}.app" ]]; then
            selected="/Applications/Xcode_${XCODE_PREFERRED}.app"
          else
            selected="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "${selected:-}" ]]; then
            echo "::error::No Xcode 26.x found on the runner. Installed:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Prompter/Prompter.xcodeproj \
            -scheme Prompter \
            -clonedSourcePackagesDirPath .spm

      - name: Build for testing
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          xcodebuild build-for-testing $XCODEBUILD_FLAGS \
            -resultBundlePath "$RUNNER_TEMP/Build.xcresult"

      - name: Test
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          xcodebuild test-without-building $XCODEBUILD_FLAGS \
            -resultBundlePath "$RUNNER_TEMP/Test.xcresult"

      - name: Release validator tests
        run: |
          set -euo pipefail
          # Added by PRMT-011 (release.sh and validate-release.py); skipped until then.
          if [[ -f Prompter/scripts/tests/test_validate_release.py ]]; then
            python3 Prompter/scripts/tests/test_validate_release.py
          else
            echo "No release validator tests yet (PRMT-011); skipping."
          fi

      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Build.xcresult
            ${{ runner.temp }}/Test.xcresult
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.65.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned SwiftLint
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/swiftlint-$SWIFTLINT_VERSION"
          ARCHIVE="$RUNNER_TEMP/swiftlint.zip"

          curl -fsSL \
            --connect-timeout 10 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            -o "$ARCHIVE" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"

          mkdir -p "$INSTALL_DIR"
          unzip -q "$ARCHIVE" -d "$INSTALL_DIR"

          SWIFTLINT_BIN="$(find "$INSTALL_DIR" -type f -name swiftlint | head -n 1)"
          if [[ -z "$SWIFTLINT_BIN" ]]; then
            echo "::error::swiftlint binary not found in release archive."
            exit 1
          fi

          chmod +x "$SWIFTLINT_BIN"
          dirname "$SWIFTLINT_BIN" >> "$GITHUB_PATH"
          "$SWIFTLINT_BIN" version

      # Errors fail the job; warnings are annotations. --strict is turned on
      # once the existing warnings are burned down (design 4.2, AC7).
      - name: Lint
        working-directory: Prompter
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging --no-cache
